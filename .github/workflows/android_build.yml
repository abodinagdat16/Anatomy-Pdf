name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "platform-tools" || true

      - name: Setup Keystore & Environment Files
        run: |
          # 1. Ensure .env exists so secrets-gradle-plugin doesn't fail
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          elif [ ! -f .env ]; then
            touch .env
            echo "Created empty .env"
          fi

          # 2. Decode or generate debug.keystore
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s debug.keystore ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure release keystore file exists for signingConfig evaluation
          if [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
            echo "Prepared fallback upload keystore from debug.keystore"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon || true

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          gradle :app:assembleDebug -Dkotlin.compiler.execution.strategy=in-process --no-daemon --no-configuration-cache --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gradle :app:assembleRelease -Dkotlin.compiler.execution.strategy=in-process --no-daemon --no-configuration-cache --stacktrace || gradle :app:assembleDebug -Dkotlin.compiler.execution.strategy=in-process --no-daemon --no-configuration-cache --stacktrace

      - name: Collect Output APKs
        run: |
          mkdir -p build-apks
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} build-apks/ \;
          echo "Collected APK files:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnatomyPDF-Android-APK
          path: build-apks/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
